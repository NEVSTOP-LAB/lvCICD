name: "lvCICD"
author: "NEVSTOP-LAB"
description: "CICD Action used for LabVIEW Users"
branding:
  icon: "anchor"
  color: "green"

inputs:
  LabVIEW_Version:
    description: "LabVIEW Version Used"
    required: false
    default: "2020"
  Architecture:
    description: "32bit/64bit Version of LabVIEW Used"
    required: false
    default: "x86"
  OperationVIFolder:
    description: "Path Contains the Operation VIs"
    required: false
    default: ""
  Operation:
    description: "The operation of lvCICD"
    required: false
    default: "lvecho"
  Parameter1:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter2:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter3:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter4:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter5:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter6:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter7:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter8:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter9:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  Parameter10:
    description: "Parameter of lvCICD"
    required: false
    default: ""
  StartupTimeout:
    description: "Max seconds to wait for the LabVIEW VI Server port to accept connections before invoking LabVIEWCLI"
    required: false
    default: "120"
  MaxRetries:
    description: "How many times to retry LabVIEWCLI when it fails with a transient communication error (`Error code : 66` or `Error code : -350000`)"
    required: false
    default: "3"
  RetryDelay:
    description: "Seconds to wait between transient-failure retries (`Error code : 66` / `Error code : -350000`)"
    required: false
    default: "10"
  RestartOnError66:
    description: "When error 66 keeps repeating, stop the process holding the VI Server port and start a fresh LabVIEW instance before retrying. Only a process verified as the targeted LabVIEW is stopped; another LabVIEW build, an unrelated service holding the port and an unreadable owner path are reported and left running. Restarting a VI Server instance also interrupts concurrent jobs that share it, so this is off by default."
    required: false
    default: "false"
  RestartAfterFailures:
    description: "Consecutive transient failures before triggering the restart escalation"
    required: false
    default: "2"
  RestartOnConnectFailure:
    description: "When the connect error -350000 keeps repeating, stop the process holding the VI Server port and start a fresh LabVIEW instance before retrying. This covers a port held by a process that is not the targeted VI Server. Only a process verified as the targeted LabVIEW is stopped; another LabVIEW build, an unrelated service holding the port and an unreadable owner path are reported and left running. Concurrent LabVIEWCLI processes make the restart be skipped."
    required: false
    default: "true"
outputs:
  Result:
    description: "Output of lvCICD"
    value: ${{ steps.lvCICDScript.outputs.Result }}
runs:
  using: "composite"

  steps:
    - name: "Checkout-lvCICD-Action"
      uses: actions/checkout@v4.1.1

    # - name: "Show working dir"
    #   run: pwd
    #   shell: powershell

    - name: "Run-lvCICD-Scripts"
      id: lvCICDScript
      run: |
        $Parameter1 = "${{ inputs.Parameter1 }}"; if ( $Parameter1 ) { $Parameter1 = """$Parameter1""" };
        $Parameter2 = "${{ inputs.Parameter2 }}"; if ( $Parameter2 ) { $Parameter2 = """$Parameter2""" };
        $Parameter3 = "${{ inputs.Parameter3 }}"; if ( $Parameter3 ) { $Parameter3 = """$Parameter3""" };
        $Parameter4 = "${{ inputs.Parameter4 }}"; if ( $Parameter4 ) { $Parameter4 = """$Parameter4""" };
        $Parameter5 = "${{ inputs.Parameter5 }}"; if ( $Parameter5 ) { $Parameter5 = """$Parameter5""" };
        $Parameter6 = "${{ inputs.Parameter6 }}"; if ( $Parameter6 ) { $Parameter6 = """$Parameter6""" };
        $Parameter7 = "${{ inputs.Parameter7 }}"; if ( $Parameter7 ) { $Parameter7 = """$Parameter7""" };
        $Parameter8 = "${{ inputs.Parameter8 }}"; if ( $Parameter8 ) { $Parameter8 = """$Parameter8""" };
        $Parameter9 = "${{ inputs.Parameter9 }}"; if ( $Parameter9 ) { $Parameter9 = """$Parameter9""" };
        $Parameter10 = "${{ inputs.Parameter10 }}"; if ( $Parameter10 ) { $Parameter10 = """$Parameter10""" };
        ${{ github.action_path }}\lvCICD.ps1 `
        "${{ inputs.LabVIEW_Version }}" `
        "${{ inputs.Architecture }}" `
        "${{ inputs.OperationVIFolder }}" `
        ${{ inputs.Operation }} `
        $Parameter1 `
        $Parameter2 `
        $Parameter3 `
        $Parameter4 `
        $Parameter5 `
        $Parameter6 `
        $Parameter7 `
        $Parameter8 `
        $Parameter9 `
        $Parameter10 `
        "${{ inputs.StartupTimeout }}" `
        "${{ inputs.MaxRetries }}" `
        "${{ inputs.RetryDelay }}" `
        "${{ inputs.RestartOnError66 }}" `
        "${{ inputs.RestartAfterFailures }}" `
        "${{ inputs.RestartOnConnectFailure }}" ;
        $Result=Get-Content -Path "${{ github.action_path }}\output.txt";
        echo "Result=$Result" >> $env:GITHUB_OUTPUT
        # Propagate LabVIEWCLI's exit code (lvCICD.ps1 intentionally does not
        # call `exit` itself, otherwise the lines above would be skipped).
        exit $LASTEXITCODE
      shell: powershell
